spring.application.name=ride-management-service
server.port=${PORT:8083}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_ride}
spring.data.mongodb.database=ridelink_ride
spring.data.mongodb.auto-index-creation=true

# Must match Account Service's JWT signing secret (at least 32 UTF-8 bytes).
ride.jwt-secret=${JWT_SECRET}
# Empty service tokens disable the corresponding integration.
ride.internal-token=${RIDE_INTERNAL_TOKEN:}
ride.driver.base-url=${DRIVER_SERVICE_URL:http://localhost:8082}
ride.driver.token=${DRIVER_SERVICE_TOKEN:}
ride.fare.base-url=${FARE_SERVICE_URL:http://localhost:8084}
ride.fare.token=${FARE_SERVICE_TOKEN:}
ride.http.connect-timeout-ms=${SERVICE_CONNECT_TIMEOUT_MS:2000}
ride.http.read-timeout-ms=${SERVICE_READ_TIMEOUT_MS:5000}
server.error.include-message=never
