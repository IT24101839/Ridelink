spring.application.name=driver-vehicle-service
server.port=${PORT:8082}
spring.data.mongodb.uri=${DRIVER_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/ridelink_driver}}
spring.data.mongodb.database=ridelink_driver
spring.data.mongodb.auto-index-creation=true
security.jwt-secret=${JWT_SECRET}
security.internal-token=${DRIVER_SERVICE_TOKEN:}
spring.jackson.deserialization.fail-on-unknown-properties=true
